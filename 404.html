<style>
  :root {
    --bg: #ffffff;
    --ink: #141414;
    --muted: #8a8a8a;
    --line: #e9e9e9;
    --ic-fb: #595959;
    --ic-ig: #8c8c8c;
    --ic-li: #6e6e6e;
    --ic-mr: #a8a8a8;
    --ic-be: #4d4d4d;
    --ic-ip: #7a7a7a;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* ---------- fixed corner chrome ---------- */
  .chrome {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    padding: clamp(28px, 5vw, 56px) clamp(24px, 5vw, 64px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  .brand {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    pointer-events: auto;
    font-family: "Noto Serif Devanagari", Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--bg);
    box-shadow: 0 0 0 8px var(--bg);
    transition: color 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
  }
  .brand:hover, .brand:focus-visible { color: var(--ink); }

  .corner {
    pointer-events: auto;
    font-size: 0.94rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--bg);
    box-shadow: 0 0 0 8px var(--bg);
    transition: opacity 0.25s ease, visibility 0.25s ease, color 0.35s ease 0.15s;
  }
  .corner.corner-hidden, .brand.corner-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .corner:hover, .corner:focus-visible, .corner[aria-current="true"] { color: var(--muted); }
  .chrome:has(.corner:hover) .brand,
  .chrome:has(.corner:focus-visible) .brand {
    color: var(--ink);
  }
  .brand.nav-active { color: var(--ink); }

  .corner-work { grid-column: 2; grid-row: 1; justify-self: end; }
  .corner-contact { grid-column: 1; grid-row: 3; justify-self: start; align-self: end; }
  .corner-about { grid-column: 2; grid-row: 3; justify-self: end; align-self: end; }

  /* ---------- stage ---------- */
  main#stage {
    height: 100vh;
    overflow-y: auto;
    display: flex;
    align-items: center;
    align-items: safe center;
    justify-content: center;
    padding: clamp(50px, 12vw, 90px) 24px clamp(60px, 15vw, 140px);
  }

  .view {
    display: none;
    width: 100%;
    max-width: 640px;
    text-align: center;
    animation: rise 0.5s ease both;
  }
  .view.active { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- home ---------- */
  .home-photo {
    display: block;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }
  .home-photo img {
    display: block;
    width: 100%;
    height: auto;
  }
  .home-caption {
    margin-top: 18px;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* ---------- contact ---------- */
  .contact-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.3rem, 2.6vw, 1.6rem);
    font-weight: 400;
    margin: 0;
  }
  .contact-role {
    margin-top: 4px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .contact-details {
    margin-top: 34px;
    font-size: 0.92rem;
    line-height: 1.9;
  }
  .contact-details a { transition: color 0.2s ease; }
  .contact-details a:hover { color: var(--muted); }

  .social-row {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 13px;
  }
  .social-row a {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .social-row a:hover { opacity: 0.75; transform: translateY(-2px); }
  .social-row svg { width: 15px; height: 15px; fill: #fff; }
  .social-row .mono {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
  }
  .social-fb { background: var(--ic-fb); }
  .social-ig { background: var(--ic-ig); }
  .social-li { background: var(--ic-li); }
  .social-mr { background: var(--ic-mr); }
  .social-be { background: var(--ic-be); }
  .social-ip { background: var(--ic-ip); }

  /* ---------- work index ---------- */
  .work-list {
    list-style: none;
    margin: 0 0 56px;
    padding: 0;
  }
  .work-list li { margin: 0; }
  .work-list button {
    display: inline-block;
    padding: 11px 0;
    font-size: 1.02rem;
    color: var(--ink);
    transition: color 0.2s ease;
  }
  .work-list button:hover, .work-list button:focus-visible { color: var(--muted); }
  .work-list .gap-before { margin-top: 20px; }

  .work-cats {
    display: flex;
    justify-content: center;
    gap: clamp(48px, 12vw, 130px);
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .work-cats button {
    font-size: 0.86rem;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .work-cats button[aria-expanded="true"] { color: var(--muted); }
  .work-cats button:hover { color: var(--muted); }

  .cat-panel {
    margin-top: 22px;
    font-size: 0.82rem;
    color: var(--muted);
    display: none;
  }
  .cat-panel.open { display: block; }

  /* ---------- piece detail ---------- */
  .piece-back {
    display: inline-block;
    margin-bottom: 26px;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .piece-back:hover { color: var(--ink); }

  .piece-frame {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    aspect-ratio: 4/5;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .piece-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .piece-frame .placeholder-note {
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0 30px;
    line-height: 1.6;
  }

  .piece-frame.gallery {
    max-width: 640px;
    aspect-ratio: auto;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .piece-frame.gallery img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 80vh;
    display: block;
  }

  .piece-image-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .piece-frame.gallery .piece-image-row img {
    width: calc(50% - 6px);
    height: auto;
    max-height: 80vh;
    display: block;
  }

  .piece-model-wrap {
    width: 100%;
  }
  .piece-model-wrap model-viewer {
    width: 100%;
    height: 62vh;
    min-height: 360px;
    background: var(--bg);
    --poster-color: var(--bg);
  }
  .piece-description {
    max-width: 52ch;
    margin: 0 auto;
    text-align: left;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--muted);
  }

  .piece-title {
    margin-top: 20px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
  }

  /* ---------- about ---------- */
  .about-statement {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    line-height: 1.6;
    font-style: italic;
    color: var(--ink);
    max-width: 46ch;
    margin: 0 auto;
  }
  .about-facts {
    margin-top: 40px;
    font-size: 0.86rem;
    color: var(--muted);
    line-height: 2;
  }

  /* ---------- small screens ---------- */
  @media (max-width: 600px) {
    .piece-image-row {
      flex-direction: column;
      gap: 28px;
    }
    .piece-frame.gallery .piece-image-row img {
      width: 100%;
    }
    .piece-model-wrap model-viewer {
      height: 52vh;
      min-height: 280px;
    }
    .work-cats {
      gap: clamp(32px, 16vw, 80px);
    }
  }
</style>
</head>

<script>
  let pieces = [];

  const views = document.querySelectorAll('.view');
  const corners = document.querySelectorAll('.chrome [data-view]');
  const sectionCorners = document.querySelectorAll('.chrome .corner');
  const brandLink = document.querySelector('.brand');
  const sectionMap = { home: 'home', work: 'work', piece: 'work', about: 'about', contact: 'contact' };

  function showView(name) {
    const canonical = document.getElementById('canonicalLink');
    if (canonical) canonical.href = 'https://rojanshrestha.com' + location.pathname;

    views.forEach(v => {
      const active = v.dataset.view === name;
      v.classList.toggle('active', active);
      if (active) {
        v.style.animation = 'none';
        void v.offsetWidth;
        v.style.animation = '';
      }
    });
    const section = sectionMap[name] || 'home';
    const isPiece = name === 'piece';
    let hasActiveCorner = false;
    sectionCorners.forEach(c => {
      const isMatch = c.dataset.view === section;
      if (isMatch) hasActiveCorner = true;
      c.setAttribute('aria-current', isMatch ? 'true' : 'false');
      c.classList.toggle('corner-hidden', isPiece || (section !== 'home' && !isMatch));
    });
    brandLink.classList.toggle('corner-hidden', isPiece);
    brandLink.classList.toggle('nav-active', !isPiece && hasActiveCorner);
    window.scrollTo(0, 0);
  }

  function navigate(path) {
    if (location.pathname !== path) history.pushState(null, '', path);
    routeFromPath();
  }

  function routeFromPath() {
    const segments = location.pathname.split('/').filter(Boolean);
    const [view, arg] = segments;
    if (view === 'piece' && arg !== undefined) {
      const index = Number.parseInt(arg, 10);
      if (Number.isInteger(index) && index >= 0 && index < pieces.length) {
        openPiece(index, false);
        return;
      }
    }
    const known = ['work', 'about', 'contact'];
    showView(known.includes(view) ? view : 'home');
  }

  corners.forEach(c => {
    c.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(c.dataset.view === 'home' ? '/' : '/' + c.dataset.view);
    });
  });

  function createModelViewer(src, altText, cameraOrbit) {
    const wrap = document.createElement('div');
    wrap.className = 'piece-model-wrap';
    const viewer = document.createElement('model-viewer');
    viewer.setAttribute('src', src);
    viewer.setAttribute('alt', altText);
    viewer.setAttribute('camera-controls', '');
    viewer.setAttribute('shadow-intensity', '0.7');
    viewer.setAttribute('exposure', '1');
    viewer.setAttribute('interaction-prompt', 'none');
    viewer.setAttribute('bounds', 'tight');
    if (cameraOrbit) viewer.setAttribute('camera-orbit', cameraOrbit);
    wrap.appendChild(viewer);
    return wrap;
  }

  function openPiece(index, setHash = true) {
    const p = pieces[index];
    if (!p) return;
    const frame = document.getElementById('pieceFrame');
    const title = document.getElementById('pieceTitle');
    frame.textContent = '';

    if (Array.isArray(p.images) && p.images.length || p.model) {
      frame.classList.add('gallery');

      if (p.model) {
        frame.appendChild(createModelViewer(p.model, `3D scan for ${p.title}`));

        if (p.description) {
          const desc = document.createElement('p');
          desc.className = 'piece-description';
          desc.textContent = p.description;
          frame.appendChild(desc);
        }
      }

      (p.images || []).forEach((item, i) => {
        if (Array.isArray(item)) {
          const row = document.createElement('div');
          row.className = 'piece-image-row';
          item.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
            img.loading = 'lazy';
            row.appendChild(img);
          });
          frame.appendChild(row);
        } else {
          const img = document.createElement('img');
          img.src = item;
          img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
          if (i > 0) img.loading = 'lazy';
          frame.appendChild(img);
        }
      });

      if (p.modelEnd) {
        frame.appendChild(createModelViewer(p.modelEnd, `3D scan for ${p.title}`, '0deg 90deg 1.8m'));
      }
    } else {
      frame.classList.remove('gallery');
      const note = document.createElement('span');
      note.className = 'placeholder-note';
      note.textContent = `Image for "${p.title}" goes here — send the photo and I'll drop it in.`;
      frame.appendChild(note);
    }

    title.textContent = p.title;
    if (setHash) navigate('/piece/' + index);
    else showView('piece');
  }

  document.getElementById('pieceBack').addEventListener('click', () => {
    navigate('/work');
  });

  function renderSite(data) {
    document.title = `${data.artist.name} | ${data.artist.role}`;

    brandLink.textContent = data.artist.nameDevanagari;

    const homePhoto = document.getElementById('homePhoto');
    homePhoto.src = data.home.photo;
    homePhoto.alt = data.home.alt || '';

    pieces = data.pieces || [];
    const workList = document.getElementById('workList');
    workList.innerHTML = '';
    pieces.forEach((p, i) => {
      const li = document.createElement('li');
      if (i > 0) li.className = 'gap-before';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.piece = String(i);
      btn.textContent = p.title;
      btn.addEventListener('click', () => openPiece(i));
      li.appendChild(btn);
      workList.appendChild(li);
    });

    const workCats = document.getElementById('workCats');
    const workCatPanels = document.getElementById('workCatPanels');
    workCats.innerHTML = '';
    workCatPanels.innerHTML = '';
    (data.workCategories || []).forEach(cat => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.cat = cat.id;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', 'cat-' + cat.id);
      btn.textContent = cat.label;
      workCats.appendChild(btn);

      const panel = document.createElement('p');
      panel.className = 'cat-panel';
      panel.id = 'cat-' + cat.id;
      panel.textContent = cat.text;
      workCatPanels.appendChild(panel);

      btn.addEventListener('click', () => {
        const isOpen = panel.classList.contains('open');
        document.querySelectorAll('.cat-panel').forEach(p2 => p2.classList.remove('open'));
        document.querySelectorAll('.work-cats button').forEach(b => b.setAttribute('aria-expanded', 'false'));
        if (!isOpen) {
          panel.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    document.getElementById('aboutStatement').textContent = `"${data.about.statement}"`;
    const factsEl = document.getElementById('aboutFacts');
    factsEl.innerHTML = '';
    (data.about.facts || []).forEach((fact, i) => {
      if (i > 0) factsEl.appendChild(document.createElement('br'));
      factsEl.appendChild(document.createTextNode(fact));
    });

    document.getElementById('contactName').textContent = data.artist.name;
    document.getElementById('contactRole').textContent = data.artist.role;
    const emailEl = document.getElementById('contactEmail');
    emailEl.href = 'mailto:' + data.artist.email;
    emailEl.textContent = data.artist.email;
    const phoneEl = document.getElementById('contactPhone');
    phoneEl.href = 'tel:' + data.artist.phone.replace(/[^\d+]/g, '');
    phoneEl.textContent = data.artist.phone;

    document.getElementById('socialIg').href = data.artist.social.instagram || '#';
    document.getElementById('socialLi').href = data.artist.social.linkedin || '#';
    document.getElementById('socialFb').href = data.artist.social.facebook || '#';
    document.getElementById('socialMr').href = data.artist.social.muckrack || '#';
    document.getElementById('socialBe').href = data.artist.social.behance || '#';
    document.getElementById('socialIp').href = data.artist.social.imagepasal || '#';

    window.addEventListener('popstate', routeFromPath);
    routeFromPath();
  }

  fetch('/content/site.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(renderSite)
    .catch(err => {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#8a8a8a">Could not load site content (content/site.json). ' + err.message + '</p>';
    });
</script>

</body>
</html>
