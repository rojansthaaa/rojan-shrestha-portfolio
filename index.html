<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rojan Shrestha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@300;400&display=swap" rel="stylesheet">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --ink: #141414;
    --muted: #8a8a8a;
    --line: #e9e9e9;
    --ic-fb: #595959;
    --ic-ig: #8c8c8c;
    --ic-tw: #a8a8a8;
    --ic-yt: #4d4d4d;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* ---------- fixed corner chrome ---------- */
  .chrome {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    padding: clamp(28px, 5vw, 56px) clamp(24px, 5vw, 64px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  .brand {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    pointer-events: auto;
    font-family: "Noto Serif Devanagari", Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    letter-spacing: 0.04em;
    color: var(--muted);
    transition: color 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
  }
  .brand:hover, .brand:focus-visible { color: var(--ink); }

  .corner {
    pointer-events: auto;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .corner.corner-hidden, .brand.corner-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .corner:hover, .corner:focus-visible, .corner[aria-current="true"] { color: var(--muted); }
  .chrome:has(.corner:hover) .brand,
  .chrome:has(.corner:focus-visible) .brand {
    color: var(--ink);
  }
  .brand.nav-active { color: var(--ink); }

  .corner-work { grid-column: 2; grid-row: 1; justify-self: end; }
  .corner-contact { grid-column: 1; grid-row: 3; justify-self: start; align-self: end; }
  .corner-about { grid-column: 2; grid-row: 3; justify-self: end; align-self: end; }

  /* ---------- stage ---------- */
  main#stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 140px 24px;
  }

  .view {
    display: none;
    width: 100%;
    max-width: 640px;
    text-align: center;
    animation: rise 0.5s ease both;
  }
  .view.active { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- home ---------- */
  .home-photo {
    display: block;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }
  .home-photo img {
    display: block;
    width: 100%;
    height: auto;
  }
  .home-caption {
    margin-top: 18px;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* ---------- contact ---------- */
  .contact-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.3rem, 2.6vw, 1.6rem);
    font-weight: 400;
    margin: 0;
  }
  .contact-role {
    margin-top: 4px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .contact-details {
    margin-top: 34px;
    font-size: 0.92rem;
    line-height: 1.9;
  }
  .contact-details a { transition: color 0.2s ease; }
  .contact-details a:hover { color: var(--muted); }

  .social-row {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 13px;
  }
  .social-row a {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .social-row a:hover { opacity: 0.75; transform: translateY(-2px); }
  .social-row svg { width: 15px; height: 15px; fill: #fff; }
  .social-fb { background: var(--ic-fb); }
  .social-ig { background: var(--ic-ig); }
  .social-tw { background: var(--ic-tw); }
  .social-yt { background: var(--ic-yt); }

  /* ---------- work index ---------- */
  .work-list {
    list-style: none;
    margin: 0 0 56px;
    padding: 0;
  }
  .work-list li { margin: 0; }
  .work-list button {
    display: inline-block;
    padding: 11px 0;
    font-size: 1.02rem;
    color: var(--ink);
    transition: color 0.2s ease;
  }
  .work-list button:hover, .work-list button:focus-visible { color: var(--muted); }
  .work-list .gap-before { margin-top: 20px; }

  .work-cats {
    display: flex;
    justify-content: center;
    gap: clamp(48px, 12vw, 130px);
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .work-cats button {
    font-size: 0.86rem;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .work-cats button[aria-expanded="true"] { color: var(--muted); }
  .work-cats button:hover { color: var(--muted); }

  .cat-panel {
    margin-top: 22px;
    font-size: 0.82rem;
    color: var(--muted);
    display: none;
  }
  .cat-panel.open { display: block; }

  /* ---------- piece detail ---------- */
  body { transition: background-color 0.08s linear; }

  .piece-back {
    display: inline-block;
    margin-bottom: 26px;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--piece-fg, var(--muted));
    transition: color 0.08s linear;
  }
  .piece-back:hover { opacity: 0.7; }

  body.has-fullscreen-hero .piece-back {
    position: fixed;
    top: clamp(28px, 5vw, 56px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    margin-bottom: 0;
  }

  .piece-hero { display: none; }
  .piece-hero.active {
    display: block;
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: 100vh;
    margin-bottom: 48px;
  }
  .piece-hero.active .piece-model-wrap {
    width: 100%;
    height: 100%;
  }
  .piece-hero.active model-viewer {
    width: 100%;
    height: 100%;
    min-height: 0;
    background: transparent;
    --poster-color: transparent;
  }

  .piece-frame {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    aspect-ratio: 4/5;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .piece-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .piece-frame .placeholder-note {
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0 30px;
    line-height: 1.6;
  }

  .piece-frame.gallery {
    max-width: 640px;
    aspect-ratio: auto;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .piece-frame.gallery img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 80vh;
    display: block;
  }

  .piece-image-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .piece-frame.gallery .piece-image-row img {
    width: calc(50% - 6px);
    height: auto;
    max-height: 80vh;
    display: block;
  }

  .piece-model-wrap {
    width: 100%;
  }
  .piece-model-wrap model-viewer {
    width: 100%;
    height: 62vh;
    min-height: 360px;
    background: var(--bg);
    --poster-color: var(--bg);
  }
  .piece-description {
    max-width: 52ch;
    margin: 0 auto;
    text-align: left;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--piece-fg, var(--muted));
    transition: color 0.08s linear;
  }

  .piece-title {
    margin-top: 20px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
  }

  /* ---------- about ---------- */
  .about-statement {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    line-height: 1.6;
    font-style: italic;
    color: var(--ink);
    max-width: 46ch;
    margin: 0 auto;
  }
  .about-facts {
    margin-top: 40px;
    font-size: 0.86rem;
    color: var(--muted);
    line-height: 2;
  }
</style>
</head>
<body>

<nav class="chrome" aria-label="Primary">
  <a class="brand" id="brandLink" href="#home" data-view="home"></a>
  <button class="corner corner-work" data-view="work">Work</button>
  <button class="corner corner-contact" data-view="contact">Contact</button>
  <button class="corner corner-about" data-view="about">About</button>
</nav>

<main id="stage">

  <section class="view" data-view="home" id="view-home">
    <figure class="home-photo">
      <img id="homePhoto" src="" alt="">
    </figure>
  </section>

  <section class="view" data-view="work" id="view-work">
    <ul class="work-list" id="workList"></ul>
    <div class="work-cats" id="workCats"></div>
    <div id="workCatPanels"></div>
  </section>

  <section class="view" data-view="piece" id="view-piece">
    <button class="piece-back" id="pieceBack" aria-label="Back to work">&larr;</button>
    <div class="piece-hero" id="pieceHero"></div>
    <div class="piece-frame" id="pieceFrame"></div>
    <p class="piece-title" id="pieceTitle"></p>
  </section>

  <section class="view" data-view="about" id="view-about">
    <p class="about-statement" id="aboutStatement"></p>
    <p class="about-facts" id="aboutFacts"></p>
  </section>

  <section class="view" data-view="contact" id="view-contact">
    <h1 class="contact-name" id="contactName"></h1>
    <p class="contact-role" id="contactRole"></p>
    <div class="contact-details">
      <div><a id="contactEmail" href="#"></a></div>
      <div><a id="contactPhone" href="#"></a></div>
    </div>
    <div class="social-row">
      <a class="social-fb" id="socialFb" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.23 10.44 22v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22C18.34 21.23 22 17.08 22 12.06Z"/></svg>
      </a>
      <a class="social-ig" id="socialIg" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.76 1.15.55.55.9 1.1 1.15 1.76.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.76 4.9 4.9 0 0 1-1.76 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.76-1.15 4.9 4.9 0 0 1-1.15-1.76c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.76A4.9 4.9 0 0 1 5.44.54C6.08.29 6.81.12 7.87.07 8.93.02 9.27 0 12 0Zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Zm5.2-8.4a1.17 1.17 0 1 1 0-2.34 1.17 1.17 0 0 1 0 2.34Z"/></svg>

      </a>
    </div>
  </section>

</main>

<script>
  let pieces = [];

  const views = document.querySelectorAll('.view');
  const corners = document.querySelectorAll('.chrome [data-view]');
  const sectionCorners = document.querySelectorAll('.chrome .corner');
  const brandLink = document.querySelector('.brand');
  const sectionMap = { home: 'home', work: 'work', piece: 'work', about: 'about', contact: 'contact' };

  function showView(name) {
    views.forEach(v => {
      const active = v.dataset.view === name;
      v.classList.toggle('active', active);
      if (active) {
        v.style.animation = 'none';
        void v.offsetWidth;
        v.style.animation = '';
      }
    });
    if (name !== 'piece') {
      document.body.classList.remove('has-fullscreen-hero');
      setGradientActive(false);
    }
    const section = sectionMap[name] || 'home';
    const isPiece = name === 'piece';
    let hasActiveCorner = false;
    sectionCorners.forEach(c => {
      const isMatch = c.dataset.view === section;
      if (isMatch) hasActiveCorner = true;
      c.setAttribute('aria-current', isMatch ? 'true' : 'false');
      c.classList.toggle('corner-hidden', isPiece || (section !== 'home' && !isMatch));
    });
    brandLink.classList.toggle('corner-hidden', isPiece);
    brandLink.classList.toggle('nav-active', !isPiece && hasActiveCorner);
    window.scrollTo(0, 0);
  }

  function routeFromHash() {
    const hash = (location.hash || '#home').slice(1);
    const [view, arg] = hash.split('/');
    if (view === 'piece' && arg !== undefined) {
      const index = Number.parseInt(arg, 10);
      if (Number.isInteger(index) && index >= 0 && index < pieces.length) {
        openPiece(index, false);
        return;
      }
    }
    const known = ['home', 'work', 'about', 'contact'];
    showView(known.includes(view) ? view : 'home');
  }

  corners.forEach(c => {
    c.addEventListener('click', (e) => {
      if (c.tagName === 'A') return;
      location.hash = '#' + c.dataset.view;
    });
  });

  function createModelViewer(src, altText, cameraOrbit) {
    const wrap = document.createElement('div');
    wrap.className = 'piece-model-wrap';
    const viewer = document.createElement('model-viewer');
    viewer.setAttribute('src', src);
    viewer.setAttribute('alt', altText);
    viewer.setAttribute('camera-controls', '');
    viewer.setAttribute('shadow-intensity', '0.7');
    viewer.setAttribute('exposure', '1');
    viewer.setAttribute('interaction-prompt', 'none');
    viewer.setAttribute('bounds', 'tight');
    if (cameraOrbit) viewer.setAttribute('camera-orbit', cameraOrbit);
    wrap.appendChild(viewer);
    return wrap;
  }

  let gradientActive = false;
  let gradientRaf = null;

  function updateScrollGradient() {
    const scrollable = document.body.scrollHeight - window.innerHeight;
    const progress = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
    const bg = Math.round(progress * 255);
    document.body.style.backgroundColor = `rgb(${bg}, ${bg}, ${bg})`;
    const fg = Math.round(255 - progress * 235);
    document.documentElement.style.setProperty('--piece-fg', `rgb(${fg}, ${fg}, ${fg})`);
  }

  function onGradientScroll() {
    if (gradientRaf) return;
    gradientRaf = requestAnimationFrame(() => { updateScrollGradient(); gradientRaf = null; });
  }

  function setGradientActive(active) {
    if (active === gradientActive) return;
    gradientActive = active;
    if (active) {
      window.addEventListener('scroll', onGradientScroll, { passive: true });
    } else {
      window.removeEventListener('scroll', onGradientScroll);
      document.body.style.backgroundColor = '';
      document.documentElement.style.removeProperty('--piece-fg');
    }
  }

  function openPiece(index, setHash = true) {
    const p = pieces[index];
    if (!p) return;
    const frame = document.getElementById('pieceFrame');
    const title = document.getElementById('pieceTitle');
    const hero = document.getElementById('pieceHero');
    frame.textContent = '';
    hero.textContent = '';
    hero.classList.remove('active');

    const isFullscreenHero = !!(p.modelFullscreen && p.model);
    document.body.classList.toggle('has-fullscreen-hero', isFullscreenHero);
    setGradientActive(isFullscreenHero);

    if (isFullscreenHero) {
      hero.appendChild(createModelViewer(p.model, `3D scan for ${p.title}`));
      hero.classList.add('active');
    }

    if (Array.isArray(p.images) && p.images.length || p.model) {
      frame.classList.add('gallery');

      if (p.model && !isFullscreenHero) {
        frame.appendChild(createModelViewer(p.model, `3D scan for ${p.title}`));
      }

      if (p.model && p.description) {
        const desc = document.createElement('p');
        desc.className = 'piece-description';
        desc.textContent = p.description;
        frame.appendChild(desc);
      }

      (p.images || []).forEach((item, i) => {
        if (Array.isArray(item)) {
          const row = document.createElement('div');
          row.className = 'piece-image-row';
          item.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
            img.loading = 'lazy';
            row.appendChild(img);
          });
          frame.appendChild(row);
        } else {
          const img = document.createElement('img');
          img.src = item;
          img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
          if (i > 0) img.loading = 'lazy';
          frame.appendChild(img);
        }
      });

      if (p.modelEnd) {
        frame.appendChild(createModelViewer(p.modelEnd, `3D scan for ${p.title}`, '0deg 90deg 1.8m'));
      }
    } else {
      frame.classList.remove('gallery');
      const note = document.createElement('span');
      note.className = 'placeholder-note';
      note.textContent = `Image for "${p.title}" goes here — send the photo and I'll drop it in.`;
      frame.appendChild(note);
    }

    title.textContent = p.title;
    if (setHash) location.hash = '#piece/' + index;
    else showView('piece');
    if (isFullscreenHero) updateScrollGradient();
  }

  document.getElementById('pieceBack').addEventListener('click', () => {
    location.hash = '#work';
  });

  function renderSite(data) {
    document.title = data.artist.name;

    brandLink.textContent = data.artist.nameDevanagari;

    const homePhoto = document.getElementById('homePhoto');
    homePhoto.src = data.home.photo;
    homePhoto.alt = data.home.alt || '';

    pieces = data.pieces || [];
    const workList = document.getElementById('workList');
    workList.innerHTML = '';
    pieces.forEach((p, i) => {
      const li = document.createElement('li');
      if (i > 0) li.className = 'gap-before';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.piece = String(i);
      btn.textContent = p.title;
      btn.addEventListener('click', () => openPiece(i));
      li.appendChild(btn);
      workList.appendChild(li);
    });

    const workCats = document.getElementById('workCats');
    const workCatPanels = document.getElementById('workCatPanels');
    workCats.innerHTML = '';
    workCatPanels.innerHTML = '';
    (data.workCategories || []).forEach(cat => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.cat = cat.id;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', 'cat-' + cat.id);
      btn.textContent = cat.label;
      workCats.appendChild(btn);

      const panel = document.createElement('p');
      panel.className = 'cat-panel';
      panel.id = 'cat-' + cat.id;
      panel.textContent = cat.text;
      workCatPanels.appendChild(panel);

      btn.addEventListener('click', () => {
        const isOpen = panel.classList.contains('open');
        document.querySelectorAll('.cat-panel').forEach(p2 => p2.classList.remove('open'));
        document.querySelectorAll('.work-cats button').forEach(b => b.setAttribute('aria-expanded', 'false'));
        if (!isOpen) {
          panel.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    document.getElementById('aboutStatement').textContent = `"${data.about.statement}"`;
    const factsEl = document.getElementById('aboutFacts');
    factsEl.innerHTML = '';
    (data.about.facts || []).forEach((fact, i) => {
      if (i > 0) factsEl.appendChild(document.createElement('br'));
      factsEl.appendChild(document.createTextNode(fact));
    });

    document.getElementById('contactName').textContent = data.artist.name;
    document.getElementById('contactRole').textContent = data.artist.role;
    const emailEl = document.getElementById('contactEmail');
    emailEl.href = 'mailto:' + data.artist.email;
    emailEl.textContent = data.artist.email;
    const phoneEl = document.getElementById('contactPhone');
    phoneEl.href = 'tel:' + data.artist.phone.replace(/[^\d+]/g, '');
    phoneEl.textContent = data.artist.phone;

    document.getElementById('socialFb').href = data.artist.social.facebook || '#';
    document.getElementById('socialIg').href = data.artist.social.instagram || '#';
    document.getElementById('socialTw').href = data.artist.social.twitter || '#';
    document.getElementById('socialYt').href = data.artist.social.youtube || '#';

    window.addEventListener('hashchange', routeFromHash);
    routeFromHash();
  }

  fetch('content/site.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(renderSite)
    .catch(err => {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#8a8a8a">Could not load site content (content/site.json). ' + err.message + '</p>';
    });
</script>

</body>
</html>
