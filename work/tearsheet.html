<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --ink: #141414;
    --muted: #8a8a8a;
    --line: #e9e9e9;
    --paper: #f6f6f4;
    --ic-fb: #595959;
    --ic-ig: #8c8c8c;
    --ic-li: #6e6e6e;
    --ic-mr: #a8a8a8;
    --ic-be: #4d4d4d;
    --ic-ip: #7a7a7a;
    --ic-x: #333333;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

  /* discourage casual saving of photos: no dragging them out, no long-press
     "save image" on phones (the right-click menu is blocked in the script) */
  img, model-viewer, canvas {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- fixed corner chrome ---------- */
  .chrome {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    padding: clamp(28px, 5vw, 56px) clamp(24px, 5vw, 64px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    /* phones: size to the visible area, not the area behind the browser's toolbar,
       so the bottom corners (Contact, About) stay on screen */
    height: 100dvh;
    padding-bottom: calc(clamp(28px, 5vw, 56px) + env(safe-area-inset-bottom, 0px));
  }

  .brand {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    pointer-events: auto;
    font-family: "Noto Serif Devanagari", Georgia, serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--bg);
    box-shadow: 0 0 0 8px var(--bg);
    transition: color 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
  }
  .brand:hover, .brand:focus-visible { color: var(--ink); }

  .corner {
    pointer-events: auto;
    font-size: 0.94rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--bg);
    box-shadow: 0 0 0 8px var(--bg);
    transition: opacity 0.25s ease, visibility 0.25s ease, color 0.35s ease 0.15s;
  }
  .corner.corner-hidden, .brand.corner-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .corner:hover, .corner:focus-visible, .corner[aria-current="true"] { color: var(--muted); }
  .chrome:has(.corner:hover) .brand,
  .chrome:has(.corner:focus-visible) .brand {
    color: var(--ink);
  }
  .brand.nav-active { color: var(--ink); }

  .corner-work { grid-column: 2; grid-row: 1; justify-self: end; }
  .corner-contact { grid-column: 1; grid-row: 3; justify-self: start; align-self: end; }
  .corner-about { grid-column: 2; grid-row: 3; justify-self: end; align-self: end; }

  /* ---------- stage ---------- */
  main#stage {
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    display: flex;
    align-items: center;
    align-items: safe center;
    justify-content: center;
    padding: clamp(50px, 12vw, 90px) 24px clamp(60px, 15vw, 140px);
    /* scrolls as normal, but without a visible scrollbar */
    scrollbar-width: none;
  }
  main#stage::-webkit-scrollbar { display: none; }

  .view {
    display: none;
    width: 100%;
    max-width: 640px;
    text-align: center;
    animation: rise 0.5s ease both;
  }
  .view.active { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- home ---------- */
  /* the English name set large across the bottom of the home page.
     One line fills the width (two lines on phones); only the descender
     of the j runs off the bottom edge. Contact / About sit just above it. */
  :root {
    --pad-x: clamp(24px, 5vw, 64px);
    --name-fs: calc((100vw - 2 * var(--pad-x)) / 4.93);  /* "Rojan Shrestha" is 4.93em wide */
    --name-h: calc(var(--name-fs) * 0.84);   /* visible height above the edge */
  }
  .home-name {
    display: none;
    position: fixed;
    left: var(--pad-x);
    bottom: calc(var(--name-fs) * -0.09);
    z-index: 2;
    margin-left: -0.035em;                    /* the R's stem lines up with CONTACT */
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: var(--name-fs);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.015em;
    white-space: nowrap;
    color: var(--ink);
    pointer-events: none;
    animation: rise 0.5s ease both;
  }
  body:has(#view-home.active) .home-name { display: block; }
  body:has(#view-home.active) .chrome { padding-bottom: calc(var(--name-h) + 34px); }
  body:has(#view-home.active) main#stage { padding-bottom: calc(var(--name-h) + 80px); }

  .home-photo {
    position: relative;
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
  }
  .home-photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: max(150px, calc(100dvh - var(--name-h) - 240px));
  }
  .home-caption {
    position: absolute;
    left: calc(100% + 22px);
    bottom: -3px;
    margin: 0;
    text-align: left;
    white-space: nowrap;
    font-size: 0.75rem;
    line-height: 1.55;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  @media (max-width: 600px) {
    :root {
      --name-fs: calc((100vw - 2 * var(--pad-x)) / 2.88);  /* "Shrestha" is 2.87em wide */
      --name-h: calc(var(--name-fs) * 1.76);
    }
    .home-name { line-height: 0.92; white-space: normal; }
    .home-name span { display: block; }
    .home-caption { position: static; margin-top: 10px; white-space: normal; }
  }

  /* ---------- design v2: shared ---------- */
  /* pages laid out across the full width, lined up with the corner links */
  .view.wide {
    max-width: none;
    text-align: left;
    padding-left: max(0px, calc(var(--pad-x) - 24px));
    padding-right: max(0px, calc(var(--pad-x) - 24px));
  }
  .serif { font-family: "Instrument Serif", "Times New Roman", serif; font-weight: 400; }
  .caps-label {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .text-links a { transition: color 0.2s ease; }
  .text-links a:hover, .text-links a:focus-visible { color: var(--muted); }

  /* ---------- contact: the email address is the page ---------- */
  :root { --email-fs: calc((100vw - 2 * var(--pad-x)) / 10.6); }
  #contactEmail {
    display: inline-block;
    margin-left: -0.05em;
    font-weight: 300;
    font-size: var(--email-fs);
    line-height: 1.05;
    letter-spacing: -0.035em;
    white-space: nowrap;
    transition: color 0.2s ease;
  }
  #contactEmail:hover, #contactEmail:focus-visible { color: var(--muted); }
  .contact-phone { margin: clamp(26px, 5vh, 56px) 0 0; font-size: clamp(18px, 1.9vw, 26px); letter-spacing: 0.01em; }
  .contact-phone a:hover { color: var(--muted); }
  .contact-links { margin: clamp(24px, 4vh, 44px) 0 0; display: flex; flex-wrap: wrap; gap: 10px 34px; font-size: 13px; }
  .contact-note { margin: clamp(36px, 8vh, 96px) 0 0; font-size: 12px; color: var(--muted); }
  .copied { margin-left: 14px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity 0.3s ease; }
  .copied.on { opacity: 1; }

  /* ---------- work index: four sections as one large list ---------- */
  .work-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(200px, 300px);
    gap: 40px;
    align-items: start;
    padding-left: clamp(0px, 10vw, 180px);
  }
  .work-index { list-style: none; margin: 0; padding: 0; }
  .work-index li { margin: 0; }
  .work-index a {
    --wi-fs: clamp(54px, 8.6vw, 128px);
    display: inline-block;
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: var(--wi-fs);
    line-height: 1.08;
    letter-spacing: -0.01em;
    transition: color 0.35s ease 0.08s;
  }
  .work-index .meta {
    position: relative;
    top: calc(var(--wi-fs) * 0.22);   /* level with the tops of the capitals */
    margin-left: 10px;
    vertical-align: top;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: inherit;
  }
  .work-index:hover a:not(:hover) { color: #d2d2cf; }
  .work-info { padding-top: 2.4em; font-size: 12px; line-height: 1.6; }
  .work-info div + div { margin-top: 2px; }

  /* cursor-following preview on the index */
  #peek {
    position: fixed;
    left: 0;
    top: 0;
    /* each photo keeps its own shape: the longer side is at most 240px */
    width: auto;
    height: auto;
    max-width: min(20vw, 240px);
    max-height: min(20vw, 240px);
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.3s ease;
    will-change: transform;
  }
  #peek.on { opacity: 1; }
  @media (hover: none) { #peek { display: none; } }

  /* small text card that follows the cursor over About / Contact */
  #peekCard {
    position: fixed;
    left: 0;
    top: 0;
    width: min(340px, 70vw);
    padding: 20px 22px;
    background: var(--bg);
    border: 1px solid var(--line);
    text-align: center;
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.3s ease;
    will-change: transform;
  }
  #peekCard.on { opacity: 1; }
  @media (hover: none) { #peekCard { display: none; } }
  #peekCard p { margin: 0; }
  #peekCard .card-bio { font-family: Arial, Helvetica, sans-serif; font-size: 0.74rem; line-height: 1.7; }
  #peekCard .card-name { font-family: "Instrument Serif", Georgia, serif; font-size: 1.5rem; line-height: 1.1; }
  #peekCard .card-role { margin-top: 3px; font-size: 0.78rem; color: var(--muted); }
  #peekCard .card-details { margin-top: 14px; font-size: 0.8rem; line-height: 1.7; }

  /* back arrow for the work sub-pages (same look as the piece back arrow) */
  .subback {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    margin-left: 2.5px;
    pointer-events: auto;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--muted);
    background: var(--bg);
    box-shadow: 0 0 0 8px var(--bg);
    transition: color 0.25s ease, opacity 0.25s ease, visibility 0.25s ease;
  }
  .subback:hover, .subback:focus-visible { color: var(--ink); }
  .subback.corner-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ---------- section titles (Projects, Tearsheet, Singles) ---------- */
  .cat-label {
    margin: 0 0 clamp(28px, 5vw, 48px);
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: clamp(36px, 3.4vw, 52px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
  }
  .cat-empty { margin: 0; font-size: 0.86rem; color: var(--muted); }

  /* ---------- projects: a calm index with a large preview ---------- */
  .cat-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 36%);
    gap: clamp(32px, 4vw, 64px);
    align-items: start;
  }
  .cat-layout[hidden] { display: none; }
  .phead, .prow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; column-gap: 12px; }
  .phead { padding-bottom: 14px; border-bottom: 1px solid #e7e7e4; }
  .phead span { margin: 0; }
  .prow {
    padding: 20px 0 22px;
    border-bottom: 1px solid #e7e7e4;
    color: var(--ink);
    transition: color 0.35s ease;
  }
  .prow .pn { padding-top: 0.9em; font-size: 12px; color: var(--muted); }
  .prow .pt {
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: clamp(34px, 4.1vw, 60px);
    line-height: 1.05;
  }
  .prow .pc { padding-top: 0.9em; font-size: 12px; white-space: nowrap; }
  @media (hover: hover) {
    .stories:has(.prow.on) .prow:not(.on) .pt,
    .stories:has(.prow.on) .prow:not(.on) .pc { color: #c9c9c5; }
  }
  .prow .pstrip { grid-column: 2 / -1; display: none; gap: 6px; margin-top: 16px; }
  .prow.on .pstrip { display: flex; }
  .pstrip img { width: 86px; height: 57px; object-fit: cover; display: block; background: var(--paper); }
  .cat-preview { position: sticky; top: 0; margin: 0; }   /* stays in view while the list scrolls */
  .cat-preview img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--paper); }
  .cat-preview figcaption { margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* ---------- tearsheet: publication index down the left ---------- */
  .ts-layout {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: clamp(32px, 5vw, 80px);
    align-items: start;
  }
  .ts-side { position: sticky; top: 0; }
  .ts-side .cat-label { margin-bottom: 26px; }
  .ts-filters { font-size: 12px; line-height: 1.42; }
  .ts-filters[hidden] { display: none; }
  .ts-filters button {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 1px 0;
    text-align: left;
    color: #a3a3a3;
    border-bottom: 1px solid transparent;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .ts-filters button:first-child { margin-bottom: 6px; padding-bottom: 4px; }
  .ts-filters button:hover { color: var(--ink); }
  .ts-filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .ts-wall { columns: 4; column-gap: 26px; text-align: left; }
  .ts-wall .clip { display: block; width: 100%; break-inside: avoid; margin-bottom: 28px; text-align: left; }
  .clip[hidden] { display: none; }
  .ts-wall .clip .shot {
    border: 1px solid #ececea;
    background: var(--paper);
    transition: border-color 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  .ts-wall .clip:hover .shot, .ts-wall .clip:focus-visible .shot { border-color: #cfcfcf; transform: translateY(-3px); }
  .ts-wall .clip img { display: block; width: 100%; height: auto; aspect-ratio: auto 3 / 4; }
  .ts-wall .cc { margin-top: 6px; font-size: 10.5px; line-height: 1.4; color: var(--muted); }

  /* ---------- singles: a contact sheet ---------- */
  .sn-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, 30%);
    gap: clamp(28px, 4vw, 64px);
    align-items: start;
  }
  .sn-layout[hidden] { display: none; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px 10px; }
  .sheet .clip { display: block; text-align: left; }
  .sheet img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: contain; background: var(--paper); }
  .sheet .num { display: block; margin-top: 3px; font-size: 9.5px; color: #9a9a96; }
  .sheet .clip.sel img { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .sheet .clip.sel .num { color: var(--ink); }
  .sn-preview { position: sticky; top: 0; margin: 0; }
  .sn-preview button { display: block; width: 100%; cursor: zoom-in; }
  .sn-preview img { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; background: var(--paper); }
  .sn-preview figcaption { margin-top: 10px; font-size: 12px; line-height: 1.5; }
  .sn-preview .sn-cap { display: block; color: var(--muted); }

  .cap { margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cap .pub { font-size: 0.78rem; }
  .cap .date {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  #lb {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(255, 255, 255, 0.97);
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(60px, 8vw, 80px) 20px;
    overflow-y: auto;
  }
  #lb.on { display: flex; animation: rise 0.3s ease both; }
  #lb .stage { width: min(1100px, 100%); text-align: center; }
  #lb img { display: block; width: 100%; height: auto; max-height: 78vh; object-fit: contain; margin: 0 auto; }
  #lb .cap { justify-content: center; gap: 22px; }
  #lb .cap a { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  #lb .cap a:hover { color: var(--ink); }
  #lb .x, #lb .prev, #lb .next {
    position: fixed;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--muted);
    transition: color 0.3s;
  }
  #lb .x:hover, #lb .prev:hover, #lb .next:hover { color: var(--ink); }
  #lb .x { top: clamp(16px, 3vw, 32px); right: clamp(20px, 5vw, 50px); }
  #lb .prev { left: clamp(14px, 3vw, 40px); top: 50%; transform: translateY(-50%); }
  #lb .next { right: clamp(14px, 3vw, 40px); top: 50%; transform: translateY(-50%); }

  /* ---------- piece detail ---------- */
  .piece-frame {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    aspect-ratio: 4/5;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .piece-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .piece-frame .placeholder-note {
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0 30px;
    line-height: 1.6;
  }

  .piece-frame.gallery {
    max-width: 640px;
    aspect-ratio: auto;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .piece-frame.gallery img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 80vh;
    display: block;
  }

  .piece-image-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .piece-frame.gallery .piece-image-row img {
    width: calc(50% - 6px);
    height: auto;
    max-height: 80vh;
    display: block;
  }

  .piece-model-wrap {
    width: 100%;
  }
  .piece-model-wrap model-viewer {
    width: 100%;
    height: 62vh;
    min-height: 360px;
    background: var(--bg);
    --poster-color: var(--bg);
  }
  .piece-description {
    max-width: 52ch;
    margin: 0 auto;
    text-align: left;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--muted);
  }

  .piece-description p { margin: 0; }
  .piece-description p + p { margin-top: 1.1em; }

  /* ---------- story: the first photograph fills the screen ---------- */
  :root { --pad-y: clamp(28px, 5vw, 56px); }
  body:has(#view-piece.active) main#stage { padding-top: 0; }
  .opener {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin-left: calc(50% - 50vw);
    overflow: hidden;
    background: #1a1a1a;
    text-align: left;
  }
  .opener[hidden] { display: none; }
  .opener img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .opener::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 22%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.6));
  }
  .opener .piece-title {
    position: absolute;
    z-index: 1;
    left: var(--pad-x);
    right: var(--pad-x);
    bottom: calc(var(--pad-y) + 30px);
    margin: 0 0 0 -0.03em;
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: clamp(56px, 12.5vw, 180px);
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: #fff;
  }
  .opener .piece-title.long { font-size: clamp(44px, 7.6vw, 124px); }
  .opener-meta, .opener-scroll {
    position: absolute;
    z-index: 1;
    bottom: var(--pad-y);
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #fff;
  }
  .opener-meta { left: var(--pad-x); }
  .opener-scroll { right: var(--pad-x); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .opener-scroll:hover { opacity: 0.7; }
  .opener + .piece-frame { margin-top: clamp(48px, 8vw, 96px); }
  /* running photo number, top right, under WORK */
  .piece-count {
    display: none;
    position: fixed;
    z-index: 50;
    right: var(--pad-x);
    top: calc(var(--pad-y) + 34px);
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink);
    pointer-events: none;
    transition: color 0.25s ease;
  }
  body:has(#view-piece.active) .piece-count { display: block; }
  /* the corner links turn white while they sit over the opening photograph */
  body.over-photo .chrome .subback,
  body.over-photo .chrome .corner { color: #fff; background: transparent; box-shadow: none; }
  body.over-photo .chrome .corner[aria-current="true"] { color: rgba(255, 255, 255, 0.72); }
  body.over-photo .piece-count { color: #fff; }

  /* ---------- about: a large statement, then the details in columns ---------- */
  .about-statement {
    margin: 0;
    max-width: 22em;
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: clamp(30px, 4.1vw, 62px);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: -0.005em;
  }
  .about-cols {
    display: grid;
    grid-template-columns: 1.5fr 1.2fr 1fr 0.8fr;
    gap: clamp(24px, 3.2vw, 48px);
    margin-top: clamp(48px, 9vh, 110px);
    font-size: 13px;
    line-height: 1.62;
    color: #2b2b28;
  }
  .about-cols p { margin: 0; }
  .about-cols p + .caps-label { margin-top: 22px; }
  .about-links a { display: table; }

  /* ---------- small screens ---------- */
  @media (max-width: 900px) {
    .work-layout { grid-template-columns: 1fr; gap: 28px; padding-left: 0; }
    .work-info { padding-top: 0; }
    .cat-layout, .ts-layout { grid-template-columns: 1fr; }
    .cat-preview { display: none; }
    .prow .pstrip { display: flex; overflow-x: auto; scrollbar-width: none; }
    .ts-side { position: static; }
    .ts-filters { display: flex; flex-wrap: wrap; gap: 2px 16px; }
    .ts-filters button { width: auto; display: inline-flex; gap: 5px; }
    .ts-filters button:first-child { margin-bottom: 0; padding-bottom: 1px; }
    .sn-layout { grid-template-columns: 1fr; }
    .sn-preview { display: none; }
    .about-cols { grid-template-columns: 1fr 1fr; }
    .piece-count { visibility: hidden; }
  }
  @media (max-width: 600px) {
    .piece-image-row {
      flex-direction: column;
      gap: 28px;
    }
    .piece-frame.gallery .piece-image-row img {
      width: 100%;
    }
    .piece-model-wrap model-viewer {
      height: 52vh;
      min-height: 280px;
    }
    .work-index a { --wi-fs: 15.5vw; }
    .view.wide { padding-top: 48px; }   /* clear of the top corner links */
    .phead, .prow { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .opener .piece-title { font-size: 19vw; }
    .opener .piece-title.long { font-size: 13vw; }
    .about-cols { grid-template-columns: 1fr; }
    .sheet { grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
    :root { --email-fs: calc((100vw - 2 * var(--pad-x)) / 6.15); }
    #contactEmail span { display: block; }
  }
  @media (max-width: 1200px) { .ts-wall { columns: 3; } }
  @media (max-width: 760px) { .ts-wall { columns: 2; } }
  @media (max-width: 480px) { .ts-wall { columns: 1; } }
</style>
</head>
<body>

<nav class="chrome" aria-label="Primary">
  <a class="brand" id="brandLink" href="/" data-view="home"><span class="brand-name">रोजन श्रेष्ठ</span><span class="sr-only"> Rojan Shrestha</span></a>

  <a class="corner corner-contact" data-view="contact" href="/contact">Contact</a>
  <a class="corner corner-about" data-view="about" href="/about">About</a>
  <button class="subback corner-hidden" id="subBack" type="button" aria-label="Back">&larr;</button>

</main>

<img id="peek" alt="" aria-hidden="true">
<div id="peekCard" aria-hidden="true"></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="x" type="button" aria-label="Close">&times;</button>
  <button class="prev" type="button" aria-label="Previous">&lsaquo;</button>
  <button class="next" type="button" aria-label="Next">&rsaquo;</button>
  <div class="stage" id="lbStage"></div>
</div>

<script>
  // Discourage casual saving of the photos: no right-click menu and no dragging
  // on photos or the 3D models. (A screenshot can never be prevented.)
  const protectedMedia = 'img, model-viewer, canvas';
  ['contextmenu', 'dragstart'].forEach(type => {
    document.addEventListener(type, (e) => {
      if (e.target && e.target.closest && e.target.closest(protectedMedia)) e.preventDefault();
    });
  });

  let pieces = [];
  let categories = [];
  let tearsheet = [];
  let singles = [];
  let legacySlugs = [];
  let currentPiece = 0;

  const views = document.querySelectorAll('.view');
  const corners = document.querySelectorAll('.chrome [data-view]');
  const sectionCorners = document.querySelectorAll('.chrome .corner');
  const brandLink = document.querySelector('.brand');
  const sectionMap = { home: 'home', work: 'work', category: 'work', tearsheet: 'work', singles: 'work', piece: 'work', about: 'about', contact: 'contact' };
  const subBack = document.getElementById('subBack');
  let gaInitialLoad = true;

  function trackPageView() {
    if (gaInitialLoad) {
      // The base gtag('config', ...) call already sent a pageview for
      // whatever URL loaded first; only fire our own for navigations
      // after that, since pushState doesn't trigger gtag's auto-tracking.
      gaInitialLoad = false;
      return;
    }
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_path: location.pathname,
        page_location: location.href,
        page_title: document.title
      });
    }
  }

  // per-page <title>, description, canonical and share tags (content/seo.json,
  // generated by tools/build_seo.py). Keeps the tab title and shared links
  // right as people move around without a page reload.
  let seo = {};
  function routeKey() {
    const p = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '');
    return p || '/';
  }
  function setHead(selector, attr, value) {
    const e = document.querySelector(selector);
    if (e && value) e.setAttribute(attr, value);
  }
  function applyRouteMeta() {
    const key = routeKey();
    const m = seo[key] || seo['/'];
    const url = 'https://rojanshrestha.com' + (key === '/' ? '/' : key);
    const canonical = document.getElementById('canonicalLink');
    if (canonical) canonical.href = url;
    if (!m) return;
    document.title = m.title;
    setHead('meta[name="description"]', 'content', m.description);
    setHead('meta[property="og:title"]', 'content', m.title);
    setHead('meta[property="og:description"]', 'content', m.description);
    setHead('meta[property="og:url"]', 'content', url);
    setHead('meta[property="og:image"]', 'content', m.image);
    setHead('meta[name="twitter:title"]', 'content', m.title);
    setHead('meta[name="twitter:description"]', 'content', m.description);
    setHead('meta[name="twitter:image"]', 'content', m.image);
  }

  function showView(name) {
    renderViewText(name);
    applyRouteMeta();
    trackPageView();

    views.forEach(v => {
      const active = v.dataset.view === name;
      v.classList.toggle('active', active);
      if (active) {
        v.style.animation = 'none';
        void v.offsetWidth;
        v.style.animation = '';
      }
    });
    const section = sectionMap[name] || 'home';
    const isPiece = name === 'piece';
    const isSub = name === 'category' || name === 'tearsheet' || name === 'singles';
    const hasBack = isSub || isPiece;
    const isWall = name === 'tearsheet' || name === 'singles';
    closeLightbox();
    ambient = name === 'home' || name === 'work' || name === 'about' || name === 'contact';
    hoverPick = null;
    hidePeek();
    let hasActiveCorner = false;
    sectionCorners.forEach(c => {
      const isMatch = c.dataset.view === section;
      if (isMatch) hasActiveCorner = true;
      c.setAttribute('aria-current', isMatch ? 'true' : 'false');
      // every page shows all three corners (the current one is greyed out).
      // A project's own page keeps only its section; the long photo walls
      // (Tearsheet, Singles) hide all three so nothing sits over the pictures
      c.classList.toggle('corner-hidden', isWall || (isPiece && !isMatch));
    });
    brandLink.classList.toggle('corner-hidden', hasBack);
    brandLink.classList.toggle('nav-active', !hasBack && hasActiveCorner);
    subBack.classList.toggle('corner-hidden', !hasBack);
    // a story opens at the top, over its opening photograph
    document.body.classList.toggle('over-photo', isPiece && !document.getElementById('pieceOpener').hidden);
    window.scrollTo(0, 0);
    document.getElementById('stage').scrollTop = 0;
  }

  function navigate(path) {
    if (location.pathname !== path) history.pushState(null, '', path);
    routeFromPath();
  }

  function routeFromPath() {
    const segments = location.pathname.split('/').filter(Boolean);
    const view = (segments[0] || '').replace(/\.html$/, '');
    const arg = segments[1] ? segments[1].replace(/\.html$/, '') : undefined;
    const slugIndex = pieces.findIndex(p => p.slug && p.slug === view);
    if (slugIndex >= 0 && arg === undefined) {
      openPiece(slugIndex, false);
      return;
    }
    if (view === 'piece' && arg !== undefined) {
      // old address (/piece/0): switch to the project's own address
      const old = Number.parseInt(arg, 10);
      const index = pieces.findIndex(p => p.slug && p.slug === legacySlugs[old]);
      if (index >= 0) {
        history.replaceState(null, '', piecePath(index));
        openPiece(index, false);
        return;
      }
    }
    if (view === 'work' && arg) {
      const cat = categories.find(c => c.id === arg);
      if (cat && cat.id === 'tearsheet') { renderTearsheet(cat); showView('tearsheet'); return; }
      if (cat && cat.id === 'singles') { renderSingles(cat); showView('singles'); return; }
      if (cat) { renderCategory(cat); showView('category'); return; }
    }
    const known = ['work', 'about', 'contact'];
    showView(known.includes(view) ? view : 'home');
  }

  corners.forEach(c => {
    c.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(c.dataset.view === 'home' ? '/' : '/' + c.dataset.view);
    });
  });

  function createModelViewer(src, altText, cameraOrbit) {
    const wrap = document.createElement('div');
    wrap.className = 'piece-model-wrap';
    const viewer = document.createElement('model-viewer');
    viewer.setAttribute('src', src);
    viewer.setAttribute('alt', altText);
    viewer.setAttribute('camera-controls', '');
    viewer.setAttribute('shadow-intensity', '0.7');
    viewer.setAttribute('exposure', '1');
    viewer.setAttribute('interaction-prompt', 'none');
    viewer.setAttribute('bounds', 'tight');
    if (cameraOrbit) viewer.setAttribute('camera-orbit', cameraOrbit);
    wrap.appendChild(viewer);
    return wrap;
  }

  // a project's address is its slug, e.g. /bittersugar
  function piecePath(i) {
    const p = pieces[i];
    return '/' + (p && p.slug ? p.slug : 'piece/' + i);
  }

  // ---------- story opening: the first photograph fills the screen ----------
  const opener = document.getElementById('pieceOpener');
  const openerImg = document.getElementById('openerImg');
  const pieceCount = document.getElementById('pieceCount');
  let countObserver = null;
  // the corner links turn white while they sit over the opening photograph
  new IntersectionObserver(([e]) => {
    const onStory = document.getElementById('view-piece').classList.contains('active');
    document.body.classList.toggle('over-photo', onStory && e.isIntersecting);
  }, { rootMargin: '0px 0px -88% 0px' }).observe(opener);
  document.getElementById('openerScroll').addEventListener('click', () => {
    document.getElementById('pieceFrame').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function openPiece(index, setHash = true) {
    const p = pieces[index];
    if (!p) return;
    currentPiece = index;
    const frame = document.getElementById('pieceFrame');
    const title = document.getElementById('pieceTitle');
    frame.textContent = '';

    // the opening photograph: `opener` if set, else the story's first photo
    // (which then is not repeated below)
    const all = flatImages(p);
    const firstSingle = typeof (p.images || [])[0] === 'string' ? p.images[0] : null;
    const openSrc = p.opener || firstSingle || all[0] || '';
    const skipFirst = !p.opener && !!firstSingle;
    opener.hidden = !openSrc;
    if (openSrc) {
      openerImg.src = openSrc;
      openerImg.alt = `${p.title} — photograph 1 of ${all.length}`;
    }
    const cat = categories.find(c => c.id === (p.category || 'projects'));
    document.getElementById('openerMeta').textContent = [
      cat ? cat.label : '',
      all.length + ' photographs',
      p.model || p.modelEnd ? '3D scans' : ''
    ].filter(Boolean).join('  ·  ');
    title.classList.toggle('long', p.title.length > 16);
    let photoNumber = skipFirst ? 1 : 0;
    const numbered = [];

    if (Array.isArray(p.images) && p.images.length || p.model) {
      frame.classList.add('gallery');

      if (p.model) {
        frame.appendChild(createModelViewer(p.model, `3D scan for ${p.title}`));
      }

      if (p.description) {
        const desc = document.createElement('div');
        desc.className = 'piece-description';
        p.description.split(/\n\s*\n/).forEach((text) => {
          const para = document.createElement('p');
          para.textContent = text;
          desc.appendChild(para);
        });
        frame.appendChild(desc);
      }

      (p.images || []).forEach((item, i) => {
        if (i === 0 && skipFirst) return;   // already the opening photograph
        if (Array.isArray(item)) {
          const row = document.createElement('div');
          row.className = 'piece-image-row';
          item.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
            img.loading = 'lazy';
            img.dataset.n = String(++photoNumber);
            numbered.push(img);
            row.appendChild(img);
          });
          frame.appendChild(row);
        } else {
          const img = document.createElement('img');
          img.src = item;
          img.alt = `${p.title} — photograph ${i + 1} of ${p.images.length}`;
          img.loading = 'lazy';
          img.dataset.n = String(++photoNumber);
          numbered.push(img);
          frame.appendChild(img);
        }
      });

      if (p.modelEnd) {
        frame.appendChild(createModelViewer(p.modelEnd, `3D scan for ${p.title}`, '0deg 90deg 1.8m'));
      }
    } else {
      frame.classList.remove('gallery');
      const note = document.createElement('span');
      note.className = 'placeholder-note';
      note.textContent = `Image for "${p.title}" goes here — send the photo and I'll drop it in.`;
      frame.appendChild(note);
    }

    title.textContent = p.title;

    // running number (01 / 23) for the photo in the middle of the screen
    const pad = n => String(n).padStart(2, '0');
    const setCount = n => { pieceCount.textContent = pad(n) + ' / ' + pad(all.length); };
    setCount(1);
    if (countObserver) countObserver.disconnect();
    countObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) setCount(en.target === opener ? 1 : Number(en.target.dataset.n));
      });
    }, { rootMargin: '-45% 0px -45% 0px' });
    countObserver.observe(opener);
    numbered.forEach(img => countObserver.observe(img));

    if (setHash) navigate(piecePath(index));
    else showView('piece');
  }

  // one back arrow for every Work sub-page: a story goes back to its section,
  // a section goes back to the Work index
  subBack.addEventListener('click', () => {
    const active = document.querySelector('.view.active');
    if (active && active.dataset.view === 'piece') {
      const p = pieces[currentPiece];
      navigate('/work/' + ((p && p.category) || 'projects'));
    } else {
      navigate('/work');
    }
  });

  /* ---------- work: index, category, tearsheet ---------- */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function flatImages(p) {
    return (p.images || []).reduce((all, x) => all.concat(x), []);
  }

  function piecesIn(catId) {
    const out = [];
    pieces.forEach((p, i) => { if ((p.category || 'projects') === catId) out.push(i); });
    return out;
  }

  function coverOf(i) {
    const p = pieces[i];
    return p.cover || flatImages(p)[0] || '';
  }

  const peek = document.getElementById('peek');
  const peekCard = document.getElementById('peekCard');
  let peekEl = peek, peekAvoid = null;
  let peekX = 0, peekY = 0, peekCx = 0, peekCy = 0, peekRaf = 0;

  // keep the preview inside the window and clear of the hovered corner button:
  // flip to the left of the cursor near the right edge
  function peekTarget(e) {
    const w = peekEl.offsetWidth || 260;
    const h = peekEl.offsetHeight || Math.round(w * 2 / 3);
    let x = e.clientX + 18;
    const flip = x + w > window.innerWidth - 12;
    if (flip) x = e.clientX - 18 - w;
    if (peekAvoid) {
      const r = peekAvoid.getBoundingClientRect();
      x = flip ? Math.min(x, r.left - 20 - w) : Math.max(x, r.right + 20);
    }
    peekX = Math.max(12, x);
    // top edge level with the pointer (lifted only near the bottom of the window)
    peekY = Math.min(Math.max(12, e.clientY), window.innerHeight - h - 12);
  }
  function peekLoop() {
    peekCx += (peekX - peekCx) * 0.4;
    peekCy += (peekY - peekCy) * 0.4;
    peekEl.style.transform = 'translate(' + Math.round(peekCx) + 'px,' + Math.round(peekCy) + 'px)';
    peekRaf = peekEl.classList.contains('on') ? requestAnimationFrame(peekLoop) : 0;
  }
  // fill the card with the About bio / the Contact details
  function fillPeekCard(viewName) {
    if (!siteData) return false;
    const d = siteData;
    peekCard.textContent = '';
    if (viewName === 'about') {
      peekCard.appendChild(el('p', 'card-bio', d.about.bio || ''));
    } else if (viewName === 'contact') {
      peekCard.appendChild(el('p', 'card-name', d.artist.name));
      peekCard.appendChild(el('p', 'card-role', d.artist.role));
      const details = el('div', 'card-details');
      details.appendChild(el('div', null, d.artist.email));
      details.appendChild(el('div', null, d.artist.phone));
      peekCard.appendChild(details);
    }
    return peekCard.childNodes.length > 0;
  }
  // ---------- the photo that follows the pointer ----------
  // Home, Work, About and Contact: a photo follows the pointer all the time and changes
  // with the slightest movement (every SWAP_PX, at most every SWAP_MS); it
  // stays put while the pointer rests.
  // Hovering a Work line shows that section's photos only (Tearsheet only
  // there); everywhere else it is Projects, Editorial and Singles.
  // About / Contact show a small text card instead.
  const SWAP_PX = 3, SWAP_MS = 30, WARM_AHEAD = 24;
  const fineHover = matchMedia('(hover: hover) and (pointer: fine)');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  let ambient = false;   // set by showView: true on Home, Work, About and Contact
  let hoverPick = null;  // the hovered link's photo picker
  let travel = 0, lastMx = -1, lastMy = -1, lastSwap = 0;

  function hidePeek() {
    peek.classList.remove('on');
    peekCard.classList.remove('on');
  }
  function activePicker() {
    return hoverPick || (ambient && !calm.matches ? nextWorkPhoto : null);
  }
  function showPhoto(pick, e) {
    const src = pick();
    if (!src) { hidePeek(); return; }
    const wasOn = peekEl === peek && peek.classList.contains('on');
    peekCard.classList.remove('on');
    peekEl = peek;
    peek.src = src;
    if (e) {
      peekTarget(e);
      if (!wasOn) { peekCx = peekX; peekCy = peekY; }
    }
    peek.classList.add('on');
    if (!peekRaf) peekLoop();
    travel = 0;
    lastSwap = performance.now();
  }
  document.addEventListener('mousemove', (e) => {
    if (!fineHover.matches) return;
    const moved = lastMx < 0 ? 0 : Math.hypot(e.clientX - lastMx, e.clientY - lastMy);
    lastMx = e.clientX;
    lastMy = e.clientY;
    if (peekEl === peekCard && peekCard.classList.contains('on')) { peekTarget(e); return; }
    const pick = activePicker();
    if (!pick) return;
    if (!peek.classList.contains('on')) { showPhoto(pick, e); return; }
    peekTarget(e);
    travel += moved;
    if (travel >= SWAP_PX && performance.now() - lastSwap >= SWAP_MS && pick.ready()) showPhoto(pick);
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { lastMx = -1; hidePeek(); });

  // `source` is a photo picker (a function returning an image path) or {card: 'about' | 'contact'}
  function attachPeek(target, source, avoid) {
    target.addEventListener('mouseenter', (e) => {
      if (target.getAttribute('aria-current') === 'true') return;
      peekAvoid = avoid ? target : null;
      if (source.card) {
        hoverPick = null;
        if (!fillPeekCard(source.card)) return;
        peek.classList.remove('on');
        peekEl = peekCard;
        peekTarget(e);
        peekCx = peekX;
        peekCy = peekY;
        peekCard.classList.add('on');
        if (!peekRaf) peekLoop();
      } else {
        hoverPick = source;
        showPhoto(source, e);
      }
    });
    target.addEventListener('mouseleave', () => {
      const leftPhotos = hoverPick === source;
      hoverPick = null;
      peekAvoid = null;
      if (peekEl === peekCard) { peekCard.classList.remove('on'); peekEl = peek; }
      const pick = activePicker();
      if (!pick) hidePeek();
      // swap straight away so a section's photo (e.g. a tearsheet) never lingers outside it
      else if (leftPhotos && pick !== source && peek.classList.contains('on')) showPhoto(pick);
    });
    target.addEventListener('click', () => { hoverPick = null; hidePeek(); });
  }

  // A shuffled "bag" of photos: every photo is shown once (random order)
  // before any repeat, and never the same one twice in a row.
  // The next WARM_AHEAD photos are loaded in advance; ready() says whether one
  // of them has arrived, so a fast-moving pointer never flashes a half-loaded photo.
  const loadedPhotos = new Set(), warmedPhotos = new Set();
  function warmPhoto(src) {
    if (!src || warmedPhotos.has(src)) return;
    warmedPhotos.add(src);
    const im = new Image();
    im.onload = () => loadedPhotos.add(src);
    im.onerror = () => warmedPhotos.delete(src);
    im.src = src;
  }
  function shuffledPicker(getPhotos) {
    let bag = [], last = '';
    function refill() {
      const all = getPhotos().filter(Boolean);
      for (let i = all.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [all[i], all[j]] = [all[j], all[i]];
      }
      if (all.length > 1 && all[all.length - 1] === last) all.unshift(all.pop());
      bag = all;
    }
    // the next photo to show: the nearest one in the bag that has already
    // loaded, so fast movement never waits for a slow one (-1: none yet)
    function loadedIndex() {
      for (let j = bag.length - 1; j >= Math.max(0, bag.length - WARM_AHEAD); j--)
        if (loadedPhotos.has(bag[j]) && bag[j] !== last) return j;
      return -1;
    }
    const pick = () => {
      if (!bag.length) refill();
      const k = loadedIndex();
      last = (k < 0 ? bag.pop() : bag.splice(k, 1)[0]) || '';
      bag.slice(-WARM_AHEAD).forEach(warmPhoto);
      return last;
    };
    pick.ready = () => {
      if (!bag.length) refill();
      bag.slice(-WARM_AHEAD).forEach(warmPhoto);
      return !bag.length || loadedIndex() >= 0;
    };
    return pick;
  }
  // WORK button: photos from Projects, Editorial and Singles (never tearsheets)
  const workPhotos = () => pieces.reduce((all, p) => all.concat(flatImages(p)), [])
    .concat(singles.map(item => item.image));
  const nextWorkPhoto = shuffledPicker(workPhotos);

  sectionCorners.forEach(c => attachPeek(c,
    c.dataset.view === 'work' ? nextWorkPhoto : { card: c.dataset.view }, true));

  function renderWorkIndex() {
    const list = document.getElementById('workIndex');
    list.textContent = '';
    categories.forEach(cat => {
      const gallery = cat.id === 'tearsheet' ? tearsheet : cat.id === 'singles' ? singles : null;
      const ids = gallery ? [] : piecesIn(cat.id);
      // small count beside each section name
      let meta;
      if (cat.id === 'tearsheet') meta = gallery.length ? String(gallery.length) : 'soon';
      else if (cat.id === 'singles') meta = gallery.length ? gallery.length + (gallery.length === 1 ? ' photograph' : ' photographs') : 'soon';
      else meta = ids.length ? ids.length + (ids.length === 1 ? ' story' : ' stories') : 'soon';
      // hover preview: a different photo from this section every time
      const nextPhoto = shuffledPicker(() => gallery
        ? gallery.map(item => item.image)
        : ids.reduce((all, i) => all.concat(flatImages(pieces[i])), []));

      const li = document.createElement('li');
      const a = el('a');
      a.href = '/work/' + cat.id;
      a.appendChild(el('span', 'name', cat.label));
      a.appendChild(el('sup', 'meta', meta));
      a.addEventListener('click', (e) => { e.preventDefault(); navigate('/work/' + cat.id); });
      attachPeek(a, nextPhoto);
      li.appendChild(a);
      list.appendChild(li);
    });

    // the small index beside the list
    const photos = pieces.reduce((n, p) => n + flatImages(p).length, 0) + singles.length;
    const info = document.getElementById('workInfo');
    info.textContent = '';
    info.appendChild(el('p', 'caps-label', 'Index'));
    info.appendChild(el('div', null, `${pieces.length} ${pieces.length === 1 ? 'story' : 'stories'} · ${photos} photographs`));
    if (tearsheet.length) info.appendChild(el('div', null, `${tearsheet.length} published pages`));
  }

  // Projects / Editorial: one row per story (number, title, count); the row
  // under the pointer shows a strip of its photos and a large preview
  function renderCategory(cat) {
    document.getElementById('catLabel').textContent = cat.label;
    const wrap = document.getElementById('catStories');
    const empty = document.getElementById('catEmpty');
    const layout = document.getElementById('catLayout');
    const preview = document.getElementById('catPreview');
    const pImg = preview.querySelector('img');
    const pCap = preview.querySelector('figcaption');
    wrap.textContent = '';
    const ids = piecesIn(cat.id);
    empty.hidden = ids.length > 0;
    layout.hidden = ids.length === 0;
    empty.textContent = cat.label + ' stories coming soon.';
    const rows = [];
    function activate(row, i) {
      rows.forEach(r => r.classList.toggle('on', r === row));
      if (pImg.getAttribute('src') !== coverOf(i)) pImg.src = coverOf(i);
      pCap.textContent = pieces[i].title;
    }
    ids.forEach((i, k) => {
      const p = pieces[i];
      const imgs = flatImages(p);
      const a = el('a', 'prow');
      a.href = piecePath(i);
      a.appendChild(el('span', 'pn', String(k + 1).padStart(2, '0')));
      a.appendChild(el('span', 'pt', p.title));
      a.appendChild(el('span', 'pc', imgs.length + (p.model || p.modelEnd ? ' · 3D scans' : '')));
      const strip = el('span', 'pstrip');
      imgs.filter(src => src !== coverOf(i)).slice(0, 7).forEach(src => {
        const t = el('img');
        t.src = src;
        t.alt = '';
        t.loading = 'lazy';
        strip.appendChild(t);
      });
      a.appendChild(strip);
      a.addEventListener('mouseenter', () => activate(a, i));
      a.addEventListener('focus', () => activate(a, i));
      a.addEventListener('click', (e) => { e.preventDefault(); openPiece(i); });
      wrap.appendChild(a);
      rows.push(a);
      warmPhoto(coverOf(i));
    });
    if (ids.length) activate(rows[0], ids[0]);
  }

  const lb = document.getElementById('lb');
  const lbStage = document.getElementById('lbStage');
  let lbItems = [], lbWall = null, lbIndex = 0, lbReturnFocus = null;

  // caption under a photo: a label on the left (publication or title) and an optional date
  function clipCaption(item) {
    const label = item.publication || item.title || '';
    if (!label && !item.date) return null;
    const cap = el('div', 'cap');
    cap.appendChild(el('span', 'pub', label));
    if (item.date) cap.appendChild(el('span', 'date', item.date));
    return cap;
  }
  function itemAlt(item) {
    return item.alt || item.title || (item.publication ? item.publication + ' tearsheet' : 'Photograph by Rojan Shrestha');
  }
  function visibleClips() {
    if (!lbWall) return [];
    return Array.from(lbWall.querySelectorAll('.clip')).filter(c => !c.hidden).map(c => Number(c.dataset.i));
  }
  function showLightbox(i) {
    lbIndex = i;
    const item = lbItems[i];
    lbStage.textContent = '';
    const img = el('img');
    img.src = item.image;
    img.alt = itemAlt(item);
    lbStage.appendChild(img);
    let cap = clipCaption(item);
    if (item.url && /^https?:\/\//.test(item.url)) {
      cap = cap || el('div', 'cap');
      const link = el('a', null, 'Read article');
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      cap.appendChild(link);
    }
    if (cap) lbStage.appendChild(cap);
  }
  function openLightbox(items, wall, i) {
    lbItems = items;
    lbWall = wall;
    lbReturnFocus = document.activeElement;
    showLightbox(i);
    lb.classList.add('on');
    lb.querySelector('.x').focus();
  }
  function closeLightbox() {
    if (!lb.classList.contains('on')) return;
    lb.classList.remove('on');
    if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus();
  }
  function stepLightbox(d) {
    const v = visibleClips();
    if (!v.length) return;
    const k = v.indexOf(lbIndex);
    showLightbox(v[(k + d + v.length) % v.length]);
  }
  lb.querySelector('.x').addEventListener('click', closeLightbox);
  lb.querySelector('.prev').addEventListener('click', () => stepLightbox(-1));
  lb.querySelector('.next').addEventListener('click', () => stepLightbox(1));
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  });

  // a wall of photos that open large when clicked (tearsheet and singles)
  function buildWall(items, wall, extraClass) {
    wall.textContent = '';
    items.forEach((item, i) => {
      const b = el('button', 'clip' + (extraClass ? ' ' + extraClass : ''));
      b.type = 'button';
      b.dataset.i = String(i);
      b.dataset.pub = item.publication || '';
      b.setAttribute('aria-label', 'View ' + itemAlt(item));
      const shot = el('div', 'shot');
      const img = el('img');
      img.src = item.image;
      img.alt = itemAlt(item);
      img.loading = 'lazy';
      shot.appendChild(img);
      b.appendChild(shot);
      // one quiet line under each page: publication · date
      const line = [item.publication || item.title, item.date].filter(Boolean).join(' · ');
      if (line) b.appendChild(el('div', 'cc', line));
      b.addEventListener('click', () => openLightbox(items, wall, i));
      wall.appendChild(b);
    });
  }

  // Tearsheet: every publication with its count down the left; click one to
  // show only its pages
  function renderTearsheet(cat) {
    document.getElementById('tsLabel').textContent = cat.label;
    const wall = document.getElementById('tsWall');
    const filters = document.getElementById('tsFilters');
    const empty = document.getElementById('tsEmpty');
    filters.textContent = '';
    empty.hidden = tearsheet.length > 0;
    empty.textContent = 'Tearsheets coming soon.';
    buildWall(tearsheet, wall);

    const counts = new Map();
    tearsheet.forEach(t => { if (t.publication) counts.set(t.publication, (counts.get(t.publication) || 0) + 1); });
    const pubs = Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    filters.hidden = pubs.length < 2;
    if (pubs.length > 1) {
      [['All']].concat(pubs).forEach(([name]) => {
        const f = el('button');
        f.type = 'button';
        f.appendChild(el('span', null, name));
        f.setAttribute('aria-pressed', name === 'All' ? 'true' : 'false');
        f.addEventListener('click', () => {
          filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
          f.setAttribute('aria-pressed', 'true');
          wall.querySelectorAll('.clip').forEach(c => { c.hidden = !(name === 'All' || c.dataset.pub === name); });
        });
        filters.appendChild(f);
      });
    }
  }

  // Singles: a contact sheet; on wide screens a click shows the photo large
  // beside the sheet (click that to open it full screen), on phones it opens
  // straight away
  const wideScreen = matchMedia('(min-width: 901px)');
  function renderSingles(cat) {
    document.getElementById('snLabel').textContent = cat.label;
    const empty = document.getElementById('snEmpty');
    const sheet = document.getElementById('snWall');
    const preview = document.getElementById('snPreview');
    const pImg = preview.querySelector('img');
    empty.hidden = singles.length > 0;
    document.getElementById('snLayout').hidden = !singles.length;
    empty.textContent = 'Singles coming soon.';
    sheet.textContent = '';
    const cells = [];
    let selected = 0;
    const num = i => String(i + 1).padStart(2, '0');
    function select(i) {
      selected = i;
      cells.forEach((c, k) => c.classList.toggle('sel', k === i));
      pImg.src = singles[i].image;
      pImg.alt = itemAlt(singles[i]);
      preview.querySelector('.sn-num').textContent = num(i);
      preview.querySelector('.sn-cap').textContent = singles[i].title || '';
    }
    singles.forEach((item, i) => {
      const b = el('button', 'clip');
      b.type = 'button';
      b.dataset.i = String(i);
      b.setAttribute('aria-label', 'View ' + itemAlt(item));
      const img = el('img');
      img.src = item.image;
      img.alt = itemAlt(item);
      img.loading = 'lazy';
      b.appendChild(img);
      b.appendChild(el('span', 'num', num(i)));
      b.addEventListener('click', () => { if (wideScreen.matches) select(i); else openLightbox(singles, sheet, i); });
      sheet.appendChild(b);
      cells.push(b);
    });
    preview.querySelector('button').onclick = () => openLightbox(singles, sheet, selected);
    if (singles.length) select(0);
  }

  // Text for About and Contact is filled in only when that page is shown (or its
  // corner is hovered), so search engines see each page with just its own text
  // and the home page stays the main page about the artist.
  let siteData = null;
  const textRendered = {};
  function renderViewText(name) {
    if (!siteData || textRendered[name]) return;
    textRendered[name] = true;
    const data = siteData;
    if (name === 'home') {
      const h = document.getElementById('homeHeading');
      if (!h.textContent) h.textContent = `${data.artist.name} — Photographer and photojournalist in Kathmandu, Nepal`;
    }
    if (name === 'about') {
      document.getElementById('aboutHeading').textContent = `About ${data.artist.name}`;
      // the bio's first sentence is the large statement, the rest sits below
      const [statement, rest] = splitBio(data.about.bio || '');
      document.getElementById('aboutStatement').textContent = statement;
      document.getElementById('aboutBio').textContent = rest;
      const lines = (target, items) => {
        target.textContent = '';
        items.forEach((text, i) => {
          if (i > 0) target.appendChild(document.createElement('br'));
          target.appendChild(document.createTextNode(text));
        });
      };
      lines(document.getElementById('aboutFacts'), data.about.facts || []);
      lines(document.getElementById('aboutWorked'), data.about.workedWith || []);
      // every publication from the Tearsheet, A to Z
      const pubs = Array.from(new Set(tearsheet.map(t => t.publication).filter(Boolean)))
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      document.getElementById('aboutPubs').textContent = pubs.join(', ');
      fillLinks(document.getElementById('aboutLinks'));
    }
    if (name === 'contact') {
      document.getElementById('contactName').textContent = data.artist.name;
      document.getElementById('contactRole').textContent = data.artist.role;
      const emailEl = document.getElementById('contactEmail');
      emailEl.href = 'mailto:' + data.artist.email;
      // two parts, so on a phone the address breaks after the @
      const at = data.artist.email.indexOf('@');
      emailEl.textContent = '';
      emailEl.appendChild(el('span', null, data.artist.email.slice(0, at + 1)));
      emailEl.appendChild(el('span', null, data.artist.email.slice(at + 1)));
      const phoneEl = document.getElementById('contactPhone');
      phoneEl.href = 'tel:' + data.artist.phone.replace(/[^\d+]/g, '');
      phoneEl.textContent = data.artist.phone;
      fillLinks(document.getElementById('contactLinks'));
      const note = (data.about.facts || []).find(f => /assignment|print/i.test(f));
      document.getElementById('contactNote').textContent = note || '';
    }
  }

  function splitBio(bio) {
    const m = bio.match(/^(.+?\.)\s+([\s\S]*)$/);
    return m ? [m[1], m[2]] : [bio, ''];
  }

  // profiles as plain text links (About and Contact)
  const SOCIAL = [['instagram', 'Instagram'], ['linkedin', 'LinkedIn'], ['muckrack', 'Muck Rack'], ['behance', 'Behance'],
                  ['imagepasal', 'Image Pasal'], ['facebook', 'Facebook'], ['x', 'X']];
  function fillLinks(target) {
    target.textContent = '';
    const social = (siteData && siteData.artist.social) || {};
    SOCIAL.forEach(([key, label]) => {
      if (!social[key]) return;
      const a = el('a', null, label);
      a.href = social[key];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      target.appendChild(a);
    });
  }

  // "copied" note when a visitor copies the email address instead of clicking it
  document.getElementById('contactEmail').addEventListener('copy', () => {
    const note = document.getElementById('emailCopied');
    note.textContent = 'copied';
    note.classList.add('on');
    clearTimeout(note._t);
    note._t = setTimeout(() => note.classList.remove('on'), 1600);
  });

  function renderSite(data) {
    siteData = data;
    // the corner link home: Devanagari name shown, English name for search engines
    const brandName = brandLink.querySelector('.brand-name');
    (brandName || brandLink).textContent = data.artist.nameDevanagari;

    document.getElementById('workHeading').textContent = `${data.artist.name} — Work`;

    const homePhoto = document.getElementById('homePhoto');
    homePhoto.src = data.home.photo;
    homePhoto.alt = data.home.alt || '';

    pieces = data.pieces || [];
    categories = data.workCategories || [];
    tearsheet = data.tearsheet || [];
    singles = data.singles || [];
    renderWorkIndex();

    window.addEventListener('popstate', routeFromPath);
    routeFromPath();
  }

  // optional files kept up to date by the upload system (stories/ and singles/ folders)
  const optionalJson = (url, fallback) =>
    fetch(url, { cache: 'no-store' }).then(res => (res.ok ? res.json() : fallback)).catch(() => fallback);

  Promise.all([
    fetch('/content/site.json', { cache: 'no-store' }).then(res => res.json()),
    optionalJson('/content/seo.json', {}),
    optionalJson('/content/stories.json', []),
    optionalJson('/content/singles.json', []),
    optionalJson('/content/tearsheet.json', [])
  ])
    .then(([site, seoData, stories, extraSingles, extraTearsheet]) => {
      seo = seoData;
      legacySlugs = (site.pieces || []).map(p => p.slug);   // for old /piece/N addresses
      site.pieces = (stories || []).concat(site.pieces || []);   // newest uploads first
      site.singles = (extraSingles || []).concat(site.singles || []);
      site.tearsheet = (extraTearsheet || []).concat(site.tearsheet || []);
      renderSite(site);
    })
    .catch(err => {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#8a8a8a">Could not load site content (content/site.json). ' + err.message + '</p>';
    });
</script>

</body>
</html>
