name: Publish new stories and photos

# Runs whenever something is uploaded to stories/ or singles/ (or content changes).
# It shrinks the photos, adds the story to the website, rebuilds the Google files
# and publishes the result. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "stories/**"
      - "singles/**"
      - "content/site.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# one run at a time, so two quick uploads never collide
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the image library
        run: pip install pillow

      - name: Process uploads
        run: python3 tools/ingest.py

      - name: Rebuild the pages and sitemap
        run: python3 tools/build_seo.py

      - name: Save and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Publish: process uploads and rebuild pages"
          git pull --rebase origin main
          git push origin main
          # ask GitHub Pages to rebuild straight away
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
