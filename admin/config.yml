local_backend: true

backend:
  name: github
  repo: rojansthaaa/rojan-shrestha-portfolio
  branch: main
  base_url: https://fantastic-squirrel-79889b.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        fields:
          - label: "Artist"
            name: "artist"
            widget: "object"
            fields:
              - { label: "Name (Devanagari script — shown top-left on every page)", name: "nameDevanagari", widget: "string" }
              - { label: "Name (Latin — used on Contact page and browser tab title)", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - label: "Social Links"
                name: "social"
                widget: "object"
                fields:
                  - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
                  - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
                  - { label: "Twitter / X URL", name: "twitter", widget: "string", required: false }
                  - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
          - label: "Home Page"
            name: "home"
            widget: "object"
            fields:
              - { label: "Hero Photo", name: "photo", widget: "image" }
              - { label: "Alt Text (for accessibility / screen readers)", name: "alt", widget: "string", required: false }
          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Statement (shown in italics, in quotes)", name: "statement", widget: "text" }
              - label: "Facts (one line each, e.g. \"Based in Kathmandu, Nepal\")"
                name: "facts"
                widget: "list"
          - label: "Work Categories"
            name: "workCategories"
            widget: "list"
            fields:
              - { label: "ID (lowercase, no spaces, e.g. \"editorial\")", name: "id", widget: "string" }
              - { label: "Label (shown as the button, e.g. \"Editorial\")", name: "label", widget: "string" }
              - { label: "Description Text", name: "text", widget: "string" }
          - label: "Pieces (Projects)"
            name: "pieces"
            widget: "list"
            summary: "{{title}} ({{fields.images.length}} photos)"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug (lowercase, hyphens instead of spaces)", name: "slug", widget: "string" }
              - label: "Photos (drag to reorder)"
                name: "images"
                widget: "list"
                field: { label: "Photo", name: "image", widget: "image" }
